<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#4a6aaa"/>
      <stop offset="40%"  stop-color="#1e2d4d"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#f07050"/>
      <stop offset="40%"  stop-color="#e8532a"/>
      <stop offset="100%" stop-color="#b83a18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="letterShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="bgClip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Outer glow ring -->
  <rect width="64" height="64" rx="15" fill="none" stroke="#e8532a" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Main background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Sheen overlay -->
  <rect width="64" height="64" rx="14" fill="url(#sheen)" clip-path="url(#bgClip)"/>

  <!-- Bottom-edge highlight line -->
  <rect x="12" y="60" width="40" height="1.5" rx="1" fill="#e8532a" fill-opacity="0.5"/>

  <!-- 3D S — shadow layer -->
  <text x="19.5" y="42.5" font-family="'Georgia','Times New Roman',serif"
    font-size="31" font-weight="900" font-style="italic"
    fill="#0a1220" fill-opacity="0.7">S</text>
  <!-- 3D S — main -->
  <text x="18" y="41" font-family="'Georgia','Times New Roman',serif"
    font-size="31" font-weight="900" font-style="italic"
    fill="url(#sGrad)" filter="url(#letterShadow)">S</text>
  <!-- 3D S — highlight -->
  <text x="18" y="41" font-family="'Georgia','Times New Roman',serif"
    font-size="31" font-weight="900" font-style="italic"
    fill="#ffffff" fill-opacity="0.12">S</text>

  <!-- 3D R — shadow layer -->
  <text x="36.5" y="42.5" font-family="'Georgia','Times New Roman',serif"
    font-size="31" font-weight="900" font-style="italic"
    fill="#5a1a08" fill-opacity="0.65">R</text>
  <!-- 3D R — main -->
  <text x="35" y="41" font-family="'Georgia','Times New Roman',serif"
    font-size="31" font-weight="900" font-style="italic"
    fill="url(#rGrad)" filter="url(#letterShadow)">R</text>
  <!-- 3D R — highlight -->
  <text x="35" y="41" font-family="'Georgia','Times New Roman',serif"
    font-size="31" font-weight="900" font-style="italic"
    fill="#ffffff" fill-opacity="0.15">R</text>

  <!-- Coral center dot -->
  <circle cx="32" cy="56.5" r="2" fill="#e8532a" fill-opacity="0.75"/>

  <!-- ── Tagline ── -->
  <!-- Divider line -->
  <line x1="4" y1="68" x2="60" y2="68" stroke="#e8532a" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- "Code · Inspire · Build · Deploy" — three words in alternating colors -->
  <text
    x="32" y="76"
    font-family="'Arial','Helvetica',sans-serif"
    font-size="5.2"
    font-weight="700"
    letter-spacing="0.5"
    text-anchor="middle"
    fill="#6b8caa"
  >CODE <tspan fill="#e8532a">·</tspan> INSPIRE <tspan fill="#e8532a">·</tspan> BUILD <tspan fill="#e8532a">·</tspan> DEPLOY</text>
</svg>
